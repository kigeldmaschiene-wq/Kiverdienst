{% extends "base.html" %}

{% block title %}Characters - KIVerdienst V2{% endblock %}
{% block header %}Character Bibliothek{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6">
    <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-semibold">Alle Characters</h3>
        <button onclick="loadCharacters()" class="text-blue-600 hover:text-blue-700 text-sm">
            ?? Aktualisieren
        </button>
    </div>
    
    <div id="charactersContainer" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
        <p class="text-gray-500 text-center py-8 col-span-full">Lade Characters...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    async function loadCharacters() {
        try {
            const characters = await api('/api/characters');
            const container = document.getElementById('charactersContainer');
            
            if (characters.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8 col-span-full">Keine Characters vorhanden.</p>';
                return;
            }
            
            container.innerHTML = characters.map(char => `
                <div class="bg-white border rounded-lg p-4 hover:shadow-lg transition">
                    <div class="text-center mb-3">
                        <div class="w-20 h-20 bg-gradient-to-br from-blue-400 to-purple-500 rounded-full mx-auto mb-2 flex items-center justify-center text-white text-2xl font-bold">
                            ${char.name.charAt(0)}
                        </div>
                        <h4 class="font-semibold">${char.name}</h4>
                        <p class="text-sm text-gray-600">${char.brand_name || 'Keine Marke'}</p>
                    </div>
                    <div class="text-sm text-gray-600 space-y-1">
                        <p><strong>Geschlecht:</strong> ${char.gender || 'N/A'}</p>
                        <p><strong>Typ:</strong> ${char.character_type || 'N/A'}</p>
                        <p><strong>Clips:</strong> ${char.clips_count || 0}</p>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error('Characters load failed:', error);
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        loadCharacters();
    });
</script>
{% endblock %}
