{% extends "base.html" %}
{% block title %}Brands - KIVerdienst v2{% endblock %}
{% block content %}
<nav class="navbar">
    <div class="nav-container">
        <div class="nav-brand">?? KIVerdienst v2</div>
        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/brands" class="active">Brands</a>
            <a href="/characters">Characters</a>
            <a href="/videos">Videos</a>
            <a href="/accounts">Accounts</a>
            <a href="/analytics">Analytics</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="header-row">
        <h1>Brands</h1>
        <button class="btn btn-primary" onclick="showCreateBrandModal()">+ Create Brand</button>
    </div>
    
    <div id="brandsList" class="list-container">
        <p>Loading brands...</p>
    </div>
</div>

<!-- Create Brand Modal -->
<div id="createBrandModal" class="modal" style="display:none;">
    <div class="modal-content">
        <h2>Create New Brand</h2>
        <form id="createBrandForm">
            <div class="form-group">
                <label>Brand Name</label>
                <input type="text" id="brandName" required>
            </div>
            <div class="form-group">
                <label>Niche</label>
                <input type="text" id="brandNiche" placeholder="e.g., AI Tools, Finance">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="brandDescription" rows="3"></textarea>
            </div>
            <div class="button-row">
                <button type="button" class="btn btn-secondary" onclick="hideCreateBrandModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Brand</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/brands.js"></script>
<script>loadBrands();</script>
{% endblock %}
