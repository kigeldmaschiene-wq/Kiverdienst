{% extends "base.html" %}

{% block title %}Marken - KIVerdienst V2{% endblock %}
{% block header %}Marken Verwaltung{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Create Brand Form -->
    <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-xl font-semibold mb-4">Neue Marke erstellen</h3>
        <form onsubmit="createBrand(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                <input type="text" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nische</label>
                <input type="text" name="niche" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="z.B. KI & Online Business">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Beschreibung</label>
                <textarea name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Videos pro Tag</label>
                <input type="number" name="videos_per_day" value="7" min="1" max="20" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            
            <div class="flex items-center">
                <input type="checkbox" name="active" id="active" checked class="mr-2">
                <label for="active" class="text-sm text-gray-700">Sofort aktivieren</label>
            </div>
            
            <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                Marke erstellen
            </button>
        </form>
    </div>
    
    <!-- Brands List -->
    <div class="lg:col-span-2">
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-semibold">Deine Marken</h3>
                <button onclick="loadBrands()" class="text-blue-600 hover:text-blue-700 text-sm">
                    ?? Aktualisieren
                </button>
            </div>
            
            <div id="brandsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="text-gray-500 text-center py-8 col-span-2">Lade Marken...</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadBrands();
    });
</script>
{% endblock %}
