{% extends "base.html" %}

{% block title %}Products - KIVerdienst V2{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Produkt-Management</h1>
            <p class="text-gray-600 mt-1">Verwalte Affiliate-Produkte und E-Books</p>
        </div>
        <button onclick="openCreateModal()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 flex items-center">
            <i class="fa-solid fa-plus mr-2"></i>Neues Produkt
        </button>
    </div>
    
    <!-- Products Grid -->
    <div id="content-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Products werden hier eingef?gt -->
    </div>
    
    <!-- Create/Edit Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full max-h-screen overflow-y-auto mx-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold" id="modal-title">Neues Produkt</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-times text-2xl"></i>
                </button>
            </div>
            
            <form id="form" onsubmit="handleSubmit(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Produkt-Name *</label>
                        <input type="text" id="name" name="name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Beschreibung</label>
                        <textarea id="description" name="description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Preis (?) *</label>
                            <input type="number" id="price" name="price" step="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Provision (%) *</label>
                            <input type="number" id="commission_percent" name="commission_percent" min="0" max="100" step="0.1" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Affiliate Link *</label>
                        <input type="url" id="affiliate_link" name="affiliate_link" required class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="https://">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nische *</label>
                        <select id="niche" name="niche" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="Finance">Finance</option>
                            <option value="Health">Health</option>
                            <option value="Tech">Tech</option>
                            <option value="Travel">Travel</option>
                            <option value="Fashion">Fashion</option>
                            <option value="Food">Food</option>
                            <option value="Education">Education</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Produkt-Bild URL (optional)</label>
                        <input type="url" id="image_url" name="image_url" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="https://">
                    </div>
                </div>
                
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">
                        Abbrechen
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                        Speichern
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let products = [];
let editingId = null;

async function loadData() {
    try {
        const data = await apiCall('/api/products');
        products = data;
        renderItems();
    } catch (error) {
        showError('Fehler beim Laden: ' + error.message);
    }
}

function renderItems() {
    const container = document.getElementById('content-container');
    
    if (products.length === 0) {
        container.innerHTML = `
            <div class="col-span-full text-center py-12">
                <i class="fa-solid fa-box text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 mb-4">Noch keine Produkte vorhanden</p>
                <button onclick="openCreateModal()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                    Erstes Produkt erstellen
                </button>
            </div>
        `;
        return;
    }
    
    container.innerHTML = products.map(product => {
        const revenue = (product.sales_count || 0) * (product.price || 0) * ((product.commission_percent || 0) / 100);
        
        return `
            <div class="bg-white rounded-lg shadow hover:shadow-lg transition">
                <div class="aspect-video bg-gray-200 rounded-t flex items-center justify-center">
                    ${product.image_url 
                        ? `<img src="${product.image_url}" class="w-full h-full object-cover rounded-t" alt="${product.name}">`
                        : '<i class="fa-solid fa-box text-6xl text-gray-400"></i>'}
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-lg mb-2">${truncate(product.name, 40)}</h3>
                    <p class="text-sm text-gray-600 mb-3 line-clamp-2">${product.description || 'Keine Beschreibung'}</p>
                    
                    <div class="flex justify-between items-center mb-3 text-sm">
                        <span class="font-bold text-lg text-green-600">${formatCurrency(product.price)}</span>
                        <span class="px-2 py-1 bg-blue-100 text-blue-800 rounded-full text-xs">
                            ${product.commission_percent}% Provision
                        </span>
                    </div>
                    
                    <div class="flex justify-between text-xs text-gray-600 mb-4">
                        <span><i class="fa-solid fa-shopping-cart mr-1"></i> ${product.sales_count || 0} Verk?ufe</span>
                        <span class="font-bold text-green-600">${formatCurrency(revenue)} Umsatz</span>
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="editItem(${product.id})" class="flex-1 px-3 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">
                            <i class="fa-solid fa-edit mr-1"></i>Bearbeiten
                        </button>
                        <button onclick="deleteItem(${product.id})" class="px-3 py-2 bg-red-500 text-white rounded hover:bg-red-600 text-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function openCreateModal() {
    editingId = null;
    document.getElementById('form').reset();
    document.getElementById('modal-title').textContent = 'Neues Produkt';
    document.getElementById('modal').classList.remove('hidden');
}

function editItem(id) {
    editingId = id;
    const product = products.find(p => p.id === id);
    if (product) {
        Object.keys(product).forEach(key => {
            const input = document.getElementById(key);
            if (input) input.value = product[key] || '';
        });
        document.getElementById('modal-title').textContent = 'Produkt bearbeiten';
        document.getElementById('modal').classList.remove('hidden');
    }
}

function closeModal() {
    document.getElementById('modal').classList.add('hidden');
}

async function handleSubmit(event) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const data = Object.fromEntries(formData);
    
    try {
        const method = editingId ? 'PUT' : 'POST';
        const url = editingId ? `/api/products/${editingId}` : '/api/products';
        
        await apiCall(url, { method, body: JSON.stringify(data) });
        
        showSuccess(editingId ? 'Produkt aktualisiert' : 'Produkt erstellt');
        closeModal();
        loadData();
    } catch (error) {
        showError('Fehler: ' + error.message);
    }
}

async function deleteItem(id) {
    if (!confirmAction('Produkt wirklich l?schen?')) return;
    
    try {
        await apiCall(`/api/products/${id}`, { method: 'DELETE' });
        showSuccess('Produkt gel?scht');
        loadData();
    } catch (error) {
        showError('Fehler: ' + error.message);
    }
}

// Initialize
document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
