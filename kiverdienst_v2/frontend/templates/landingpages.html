{% extends "base.html" %}

{% block title %}Landing Pages - KIVerdienst V2{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Landing Page Builder</h1>
            <p class="text-gray-600 mt-1">Erstelle und verwalte deine Landing Pages</p>
        </div>
        <button onclick="openCreateModal()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 flex items-center">
            <i class="fa-solid fa-plus mr-2"></i>Neue Landing Page
        </button>
    </div>
    
    <!-- Landing Pages Grid -->
    <div id="content-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Landing Pages werden hier eingef?gt -->
    </div>
    
    <!-- Create/Edit Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-3xl w-full max-h-screen overflow-y-auto mx-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold" id="modal-title">Neue Landing Page</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-times text-2xl"></i>
                </button>
            </div>
            
            <!-- Tabs -->
            <div class="mb-6 border-b border-gray-200">
                <nav class="flex space-x-4">
                    <button onclick="switchTab('content')" data-tab="content" class="tab-btn px-4 py-2 border-b-2 border-blue-500 text-blue-600 font-medium">
                        Content
                    </button>
                    <button onclick="switchTab('design')" data-tab="design" class="tab-btn px-4 py-2 border-b-2 border-transparent text-gray-500">
                        Design
                    </button>
                    <button onclick="switchTab('seo')" data-tab="seo" class="tab-btn px-4 py-2 border-b-2 border-transparent text-gray-500">
                        SEO
                    </button>
                </nav>
            </div>
            
            <form id="form" onsubmit="handleSubmit(event)">
                <!-- Tab 1: Content -->
                <div id="tab-content" class="tab-content space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Titel *</label>
                        <input type="text" id="title" name="title" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Headline *</label>
                        <input type="text" id="headline" name="headline" required class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="z.B. Jetzt kostenlos downloaden!">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Beschreibung</label>
                        <textarea id="description" name="description" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Lead Magnet Typ *</label>
                        <select id="lead_magnet_type" name="lead_magnet_type" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="PDF">PDF Download</option>
                            <option value="Video">Video Training</option>
                            <option value="Checklist">Checkliste</option>
                            <option value="Template">Template</option>
                            <option value="Course">Mini-Kurs</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Button Text *</label>
                        <input type="text" id="button_text" name="button_text" required class="w-full px-3 py-2 border border-gray-300 rounded-lg" value="Jetzt kostenlos sichern">
                    </div>
                </div>
                
                <!-- Tab 2: Design -->
                <div id="tab-design" class="tab-content space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Template *</label>
                        <select id="template" name="template" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="modern">Modern</option>
                            <option value="minimal">Minimal</option>
                            <option value="bold">Bold</option>
                            <option value="classic">Classic</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Farbschema *</label>
                        <select id="color_scheme" name="color_scheme" required class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                            <option value="blue">Blau</option>
                            <option value="green">Gr?n</option>
                            <option value="purple">Lila</option>
                            <option value="orange">Orange</option>
                            <option value="red">Rot</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Hero Image URL (optional)</label>
                        <input type="url" id="hero_image_url" name="hero_image_url" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    </div>
                </div>
                
                <!-- Tab 3: SEO -->
                <div id="tab-seo" class="tab-content space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Meta Titel</label>
                        <input type="text" id="meta_title" name="meta_title" class="w-full px-3 py-2 border border-gray-300 rounded-lg" maxlength="60">
                        <p class="text-xs text-gray-500 mt-1">Max. 60 Zeichen</p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Meta Beschreibung</label>
                        <textarea id="meta_description" name="meta_description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg" maxlength="160"></textarea>
                        <p class="text-xs text-gray-500 mt-1">Max. 160 Zeichen</p>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Keywords (kommagetrennt)</label>
                        <input type="text" id="keywords" name="keywords" class="w-full px-3 py-2 border border-gray-300 rounded-lg" placeholder="keyword1, keyword2, keyword3">
                    </div>
                </div>
                
                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg hover:bg-gray-400">
                        Abbrechen
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                        Speichern
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let pages = [];
let editingId = null;

async function loadData() {
    try {
        const data = await apiCall('/api/landing-pages');
        pages = data;
        renderItems();
    } catch (error) {
        showError('Fehler beim Laden: ' + error.message);
    }
}

function renderItems() {
    const container = document.getElementById('content-container');
    
    if (pages.length === 0) {
        container.innerHTML = `
            <div class="col-span-full text-center py-12">
                <i class="fa-solid fa-file text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 mb-4">Noch keine Landing Pages vorhanden</p>
                <button onclick="openCreateModal()" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                    Erste Landing Page erstellen
                </button>
            </div>
        `;
        return;
    }
    
    container.innerHTML = pages.map(page => {
        const conversionRate = page.views > 0 
            ? ((page.conversions / page.views) * 100).toFixed(1)
            : 0;
        
        return `
            <div class="bg-white rounded-lg shadow hover:shadow-lg transition">
                <div class="aspect-video bg-gradient-to-br from-blue-400 to-purple-500 rounded-t flex items-center justify-center text-white">
                    <div class="text-center">
                        <i class="fa-solid fa-file-invoice text-6xl mb-2"></i>
                        <p class="text-sm">${page.template || 'Modern'} Template</p>
                    </div>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-lg mb-2">${truncate(page.title, 40)}</h3>
                    <p class="text-sm text-gray-600 mb-3">${truncate(page.headline || '', 60)}</p>
                    
                    <div class="flex justify-between text-xs text-gray-600 mb-3">
                        <span><i class="fa-solid fa-eye mr-1"></i> ${formatNumber(page.views || 0)} Views</span>
                        <span><i class="fa-solid fa-user-check mr-1"></i> ${page.conversions || 0} Conversions</span>
                    </div>
                    
                    <div class="mb-4">
                        <div class="flex justify-between text-xs mb-1">
                            <span>Conversion Rate</span>
                            <span class="font-bold">${conversionRate}%</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-2">
                            <div class="bg-green-500 h-2 rounded-full" style="width: ${Math.min(conversionRate, 100)}%"></div>
                        </div>
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="viewPage(${page.id})" class="flex-1 px-3 py-2 bg-green-500 text-white rounded hover:bg-green-600 text-sm">
                            <i class="fa-solid fa-eye mr-1"></i>Ansehen
                        </button>
                        <button onclick="editItem(${page.id})" class="px-3 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">
                            <i class="fa-solid fa-edit"></i>
                        </button>
                        <button onclick="deleteItem(${page.id})" class="px-3 py-2 bg-red-500 text-white rounded hover:bg-red-600 text-sm">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function switchTab(tabName) {
    // Update tab buttons
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-blue-500', 'text-blue-600');
        btn.classList.add('border-transparent', 'text-gray-500');
    });
    document.querySelector(`[data-tab="${tabName}"]`).classList.add('border-blue-500', 'text-blue-600');
    document.querySelector(`[data-tab="${tabName}"]`).classList.remove('border-transparent', 'text-gray-500');
    
    // Show/hide tab content
    document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.add('hidden');
    });
    document.getElementById(`tab-${tabName}`).classList.remove('hidden');
}

function openCreateModal() {
    editingId = null;
    document.getElementById('form').reset();
    document.getElementById('modal-title').textContent = 'Neue Landing Page';
    switchTab('content');
    document.getElementById('modal').classList.remove('hidden');
}

function editItem(id) {
    editingId = id;
    const page = pages.find(p => p.id === id);
    if (page) {
        Object.keys(page).forEach(key => {
            const input = document.getElementById(key);
            if (input) input.value = page[key] || '';
        });
        document.getElementById('modal-title').textContent = 'Landing Page bearbeiten';
        switchTab('content');
        document.getElementById('modal').classList.remove('hidden');
    }
}

function closeModal() {
    document.getElementById('modal').classList.add('hidden');
}

async function handleSubmit(event) {
    event.preventDefault();
    const formData = new FormData(event.target);
    const data = Object.fromEntries(formData);
    data.status = 'active';
    
    try {
        const method = editingId ? 'PUT' : 'POST';
        const url = editingId ? `/api/landing-pages/${editingId}` : '/api/landing-pages';
        
        await apiCall(url, { method, body: JSON.stringify(data) });
        
        showSuccess(editingId ? 'Landing Page aktualisiert' : 'Landing Page erstellt');
        closeModal();
        loadData();
    } catch (error) {
        showError('Fehler: ' + error.message);
    }
}

async function deleteItem(id) {
    if (!confirmAction('Landing Page wirklich l?schen?')) return;
    
    try {
        await apiCall(`/api/landing-pages/${id}`, { method: 'DELETE' });
        showSuccess('Landing Page gel?scht');
        loadData();
    } catch (error) {
        showError('Fehler: ' + error.message);
    }
}

function viewPage(id) {
    window.open(`/landing/${id}`, '_blank');
}

// Initialize
document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
