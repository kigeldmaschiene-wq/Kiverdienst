{% extends "base.html" %}

{% block title %}System Logs - KIVerdienst V2{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">System Logs</h1>
            <p class="text-gray-600 mt-1">?berwache Systemaktivit?ten und Fehler</p>
        </div>
        <div class="flex gap-2">
            <select id="log-level" class="px-3 py-2 border border-gray-300 rounded-lg" onchange="loadData()">
                <option value="all">Alle Levels</option>
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
                <option value="DEBUG">DEBUG</option>
            </select>
            <button onclick="loadData()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                <i class="fa-solid fa-refresh mr-2"></i>Aktualisieren
            </button>
            <button onclick="clearLogs()" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">
                <i class="fa-solid fa-trash mr-2"></i>L?schen
            </button>
        </div>
    </div>
    
    <!-- Auto-Scroll Toggle -->
    <div class="mb-4 flex items-center">
        <label class="flex items-center cursor-pointer">
            <input type="checkbox" id="auto-scroll" class="mr-2" checked>
            <span class="text-sm text-gray-700">Auto-Scroll aktivieren</span>
        </label>
    </div>
    
    <!-- Console -->
    <div class="bg-gray-900 rounded-lg shadow p-4 font-mono text-sm overflow-y-auto" id="log-console" style="height: 600px;">
        <div id="log-content" class="space-y-1">
            <div class="text-gray-500">
                <i class="fa-solid fa-spinner fa-spin mr-2"></i>Lade Logs...
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let logs = [];
let autoRefreshInterval = null;

async function loadData() {
    try {
        const level = document.getElementById('log-level').value;
        const url = level === 'all' ? '/api/logs' : `/api/logs?level=${level}`;
        
        const data = await apiCall(url);
        logs = data;
        renderLogs();
    } catch (error) {
        showError('Fehler beim Laden: ' + error.message);
    }
}

function renderLogs() {
    const content = document.getElementById('log-content');
    const autoScroll = document.getElementById('auto-scroll').checked;
    
    if (logs.length === 0) {
        content.innerHTML = `
            <div class="text-gray-500 text-center py-12">
                <i class="fa-solid fa-inbox text-4xl mb-4"></i>
                <p>Keine Logs vorhanden</p>
            </div>
        `;
        return;
    }
    
    const levelColors = {
        'INFO': 'text-green-400',
        'WARNING': 'text-yellow-400',
        'ERROR': 'text-red-400',
        'DEBUG': 'text-blue-400'
    };
    
    const levelIcons = {
        'INFO': 'fa-circle-info',
        'WARNING': 'fa-triangle-exclamation',
        'ERROR': 'fa-circle-xmark',
        'DEBUG': 'fa-bug'
    };
    
    content.innerHTML = logs.map(log => {
        const color = levelColors[log.level] || 'text-gray-400';
        const icon = levelIcons[log.level] || 'fa-circle';
        const timestamp = new Date(log.timestamp).toLocaleString('de-DE');
        
        return `
            <div class="${color}">
                <span class="text-gray-500">[${timestamp}]</span>
                <i class="fa-solid ${icon} mx-2"></i>
                <span class="font-bold">${log.level}</span>
                <span class="text-gray-300 mx-2">|</span>
                <span>${log.message}</span>
                ${log.details ? `<div class="ml-8 text-gray-500 text-xs mt-1">${log.details}</div>` : ''}
            </div>
        `;
    }).join('');
    
    // Auto-scroll to bottom
    if (autoScroll) {
        const console = document.getElementById('log-console');
        console.scrollTop = console.scrollHeight;
    }
}

async function clearLogs() {
    if (!confirmAction('Alle Logs wirklich l?schen?')) return;
    
    try {
        await apiCall('/api/logs', { method: 'DELETE' });
        showSuccess('Logs gel?scht');
        loadData();
    } catch (error) {
        showError('Fehler: ' + error.message);
    }
}

// Auto-refresh every 5 seconds
function startAutoRefresh() {
    autoRefreshInterval = setInterval(() => {
        loadData();
    }, 5000);
}

function stopAutoRefresh() {
    if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
    }
}

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    startAutoRefresh();
});

// Stop auto-refresh when leaving page
window.addEventListener('beforeunload', stopAutoRefresh);
</script>
{% endblock %}
