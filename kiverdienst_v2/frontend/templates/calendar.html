{% extends "base.html" %}

{% block title %}Content Calendar - KIVerdienst V2{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Content Calendar</h1>
            <p class="text-gray-600 mt-1">Plane und ?berwache deine Content-Ver?ffentlichungen</p>
        </div>
        <div class="flex gap-2">
            <select id="view-mode" class="px-3 py-2 border border-gray-300 rounded-lg" onchange="switchView()">
                <option value="month">Monat</option>
                <option value="week">Woche</option>
                <option value="day">Tag</option>
            </select>
            <button onclick="prevPeriod()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button onclick="today()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100">
                Heute
            </button>
            <button onclick="nextPeriod()" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>
    
    <!-- Current Period Display -->
    <div class="mb-6 text-center">
        <h2 class="text-2xl font-bold" id="period-title">Oktober 2025</h2>
    </div>
    
    <!-- Month View -->
    <div id="month-view" class="bg-white rounded-lg shadow">
        <div class="grid grid-cols-7 gap-px bg-gray-200">
            <!-- Weekday Headers -->
            <div class="bg-gray-50 p-3 text-center font-bold text-sm">Mo</div>
            <div class="bg-gray-50 p-3 text-center font-bold text-sm">Di</div>
            <div class="bg-gray-50 p-3 text-center font-bold text-sm">Mi</div>
            <div class="bg-gray-50 p-3 text-center font-bold text-sm">Do</div>
            <div class="bg-gray-50 p-3 text-center font-bold text-sm">Fr</div>
            <div class="bg-gray-50 p-3 text-center font-bold text-sm">Sa</div>
            <div class="bg-gray-50 p-3 text-center font-bold text-sm">So</div>
            
            <!-- Calendar Days -->
            <div id="calendar-grid" class="col-span-7 grid grid-cols-7 gap-px bg-gray-200">
                <!-- Days werden hier eingef?gt -->
            </div>
        </div>
    </div>
    
    <!-- Week View -->
    <div id="week-view" class="bg-white rounded-lg shadow hidden">
        <div id="week-content" class="p-6">
            <!-- Week content wird hier eingef?gt -->
        </div>
    </div>
    
    <!-- Day View -->
    <div id="day-view" class="bg-white rounded-lg shadow hidden">
        <div id="day-content" class="p-6">
            <!-- Day content wird hier eingef?gt -->
        </div>
    </div>
    
    <!-- Detail Modal -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-2xl w-full max-h-screen overflow-y-auto mx-4">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold" id="detail-date">1. Oktober 2025</h2>
                <button onclick="closeDetailModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-times text-2xl"></i>
                </button>
            </div>
            
            <div id="detail-content" class="space-y-4">
                <!-- Videos for selected date -->
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentDate = new Date();
let currentView = 'month';
let calendarData = {};

async function loadData() {
    try {
        const month = currentDate.getMonth() + 1;
        const year = currentDate.getFullYear();
        
        const data = await apiCall(`/api/calendar?month=${month}&year=${year}`);
        calendarData = data;
        renderCalendar();
    } catch (error) {
        showError('Fehler beim Laden: ' + error.message);
    }
}

function renderCalendar() {
    if (currentView === 'month') {
        renderMonthView();
    } else if (currentView === 'week') {
        renderWeekView();
    } else {
        renderDayView();
    }
    updatePeriodTitle();
}

function renderMonthView() {
    const grid = document.getElementById('calendar-grid');
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    
    // Get first day of month and total days
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startDayOfWeek = (firstDay.getDay() + 6) % 7; // Monday = 0
    
    let html = '';
    
    // Empty cells before month starts
    for (let i = 0; i < startDayOfWeek; i++) {
        html += '<div class="bg-gray-50 h-24"></div>';
    }
    
    // Days of month
    const today = new Date();
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const videos = calendarData[dateStr] || [];
        const isToday = day === today.getDate() && month === today.getMonth() && year === today.getFullYear();
        
        html += `
            <div class="bg-white h-24 p-2 cursor-pointer hover:bg-gray-50 transition" onclick="showDayDetail('${dateStr}')">
                <div class="flex justify-between items-start mb-1">
                    <span class="text-sm font-bold ${isToday ? 'text-blue-600' : 'text-gray-900'}">${day}</span>
                    ${videos.length > 0 ? `<span class="bg-blue-500 text-white text-xs px-2 py-1 rounded-full">${videos.length}</span>` : ''}
                </div>
                <div class="space-y-1">
                    ${videos.slice(0, 2).map(v => `
                        <div class="text-xs truncate px-2 py-1 bg-blue-100 rounded">
                            ${v.title || 'Video'}
                        </div>
                    `).join('')}
                    ${videos.length > 2 ? `<div class="text-xs text-gray-500">+${videos.length - 2} mehr</div>` : ''}
                </div>
            </div>
        `;
    }
    
    grid.innerHTML = html;
}

function renderWeekView() {
    const content = document.getElementById('week-content');
    
    // Get week start (Monday)
    const weekStart = new Date(currentDate);
    weekStart.setDate(currentDate.getDate() - ((currentDate.getDay() + 6) % 7));
    
    let html = '<div class="space-y-4">';
    
    for (let i = 0; i < 7; i++) {
        const day = new Date(weekStart);
        day.setDate(weekStart.getDate() + i);
        
        const dateStr = day.toISOString().split('T')[0];
        const videos = calendarData[dateStr] || [];
        
        const dayName = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'][i];
        
        html += `
            <div class="border-b border-gray-200 pb-4">
                <h3 class="font-bold mb-2">${dayName}, ${day.getDate()}.${day.getMonth() + 1}.${day.getFullYear()}</h3>
                ${videos.length > 0 ? `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                        ${videos.map(v => `
                            <div class="bg-blue-50 p-3 rounded">
                                <p class="font-medium text-sm">${v.title}</p>
                                <p class="text-xs text-gray-600">${v.brand_name}</p>
                            </div>
                        `).join('')}
                    </div>
                ` : '<p class="text-gray-500 text-sm">Keine Videos geplant</p>'}
            </div>
        `;
    }
    
    html += '</div>';
    content.innerHTML = html;
}

function renderDayView() {
    const content = document.getElementById('day-content');
    const dateStr = currentDate.toISOString().split('T')[0];
    const videos = calendarData[dateStr] || [];
    
    if (videos.length === 0) {
        content.innerHTML = `
            <div class="text-center py-12">
                <i class="fa-solid fa-calendar-xmark text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500">Keine Videos f?r diesen Tag geplant</p>
            </div>
        `;
        return;
    }
    
    content.innerHTML = `
        <div class="space-y-4">
            ${videos.map(v => `
                <div class="border border-gray-200 rounded-lg p-4">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold">${v.title}</h3>
                        <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800">${v.status}</span>
                    </div>
                    <p class="text-sm text-gray-600 mb-2">${v.brand_name}</p>
                    <div class="flex gap-4 text-sm text-gray-600">
                        <span><i class="fa-brands fa-${v.platform} mr-1"></i> ${v.platform}</span>
                        <span><i class="fa-solid fa-clock mr-1"></i> ${v.scheduled_time || '12:00'}</span>
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function switchView() {
    currentView = document.getElementById('view-mode').value;
    
    // Hide all views
    document.getElementById('month-view').classList.add('hidden');
    document.getElementById('week-view').classList.add('hidden');
    document.getElementById('day-view').classList.add('hidden');
    
    // Show selected view
    document.getElementById(`${currentView}-view`).classList.remove('hidden');
    
    renderCalendar();
}

function prevPeriod() {
    if (currentView === 'month') {
        currentDate.setMonth(currentDate.getMonth() - 1);
    } else if (currentView === 'week') {
        currentDate.setDate(currentDate.getDate() - 7);
    } else {
        currentDate.setDate(currentDate.getDate() - 1);
    }
    loadData();
}

function nextPeriod() {
    if (currentView === 'month') {
        currentDate.setMonth(currentDate.getMonth() + 1);
    } else if (currentView === 'week') {
        currentDate.setDate(currentDate.getDate() + 7);
    } else {
        currentDate.setDate(currentDate.getDate() + 1);
    }
    loadData();
}

function today() {
    currentDate = new Date();
    loadData();
}

function updatePeriodTitle() {
    const title = document.getElementById('period-title');
    const months = ['Januar', 'Februar', 'M?rz', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    
    if (currentView === 'month') {
        title.textContent = `${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
    } else if (currentView === 'week') {
        const weekStart = new Date(currentDate);
        weekStart.setDate(currentDate.getDate() - ((currentDate.getDay() + 6) % 7));
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 6);
        title.textContent = `${weekStart.getDate()}.${weekStart.getMonth() + 1}. - ${weekEnd.getDate()}.${weekEnd.getMonth() + 1}.${weekEnd.getFullYear()}`;
    } else {
        title.textContent = `${currentDate.getDate()}. ${months[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
    }
}

function showDayDetail(dateStr) {
    const videos = calendarData[dateStr] || [];
    const date = new Date(dateStr);
    const months = ['Januar', 'Februar', 'M?rz', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    
    document.getElementById('detail-date').textContent = `${date.getDate()}. ${months[date.getMonth()]} ${date.getFullYear()}`;
    
    const content = document.getElementById('detail-content');
    if (videos.length === 0) {
        content.innerHTML = `
            <div class="text-center py-8">
                <i class="fa-solid fa-calendar-xmark text-4xl text-gray-300 mb-2"></i>
                <p class="text-gray-500">Keine Videos f?r diesen Tag geplant</p>
            </div>
        `;
    } else {
        content.innerHTML = videos.map(v => `
            <div class="border border-gray-200 rounded-lg p-4">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold">${v.title}</h3>
                    <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800">${v.status}</span>
                </div>
                <p class="text-sm text-gray-600 mb-2">${v.brand_name}</p>
                <div class="flex gap-4 text-sm text-gray-600">
                    <span><i class="fa-brands fa-${v.platform} mr-1"></i> ${v.platform}</span>
                    <span><i class="fa-solid fa-clock mr-1"></i> ${v.scheduled_time || '12:00'}</span>
                </div>
            </div>
        `).join('');
    }
    
    document.getElementById('detail-modal').classList.remove('hidden');
}

function closeDetailModal() {
    document.getElementById('detail-modal').classList.add('hidden');
}

// Initialize
document.addEventListener('DOMContentLoaded', loadData);
</script>
{% endblock %}
